name: Windows build (builder)

# This workflow is Aurivox's Windows build path (SPEC §14): the dev
# environment is Linux, so Windows binaries are produced and verified
# here, on GitHub's windows-latest runners.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (type-check + bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Shadow-lab228/aurivox
          token: ${{ secrets.AURIVOX_SOURCE_TOKEN }}
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  windows:
    name: Windows app (Rust + Tauri bundle)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Shadow-lab228/aurivox
          token: ${{ secrets.AURIVOX_SOURCE_TOKEN }}
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # sherpa-onnx-sys links prebuilt static libs. Its build script
      # downloads them into the (cached) target dir and skips the
      # download whenever a cache folder already exists — a stale or
      # partial rust-cache restore therefore links against nothing
      # ("could not find native static library sherpa-onnx-c-api").
      # Fetch the exact archive ourselves and point the crate at it
      # via SHERPA_ONNX_LIB_DIR, which its build script checks first.
      - name: Fetch sherpa-onnx prebuilt libs (win-x64, static)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stem = 'sherpa-onnx-v2.0.1-win-x64-static-MT-Release-lib'
          $url = "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/$stem.tar.bz2"
          $dest = Join-Path $env:RUNNER_TEMP 'sherpa-onnx-prebuilt'
          New-Item -ItemType Directory -Force $dest | Out-Null
          $archive = Join-Path $dest "$stem.tar.bz2"
          Invoke-WebRequest -Uri $url -OutFile $archive
          tar -xjf $archive -C $dest
          $libDir = Join-Path $dest "$stem\lib"
          if (-not (Test-Path (Join-Path $libDir 'sherpa-onnx-c-api.lib'))) {
            throw "sherpa-onnx-c-api.lib missing after extract at $libDir"
          }
          "SHERPA_ONNX_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "SHERPA_ONNX_LIB_DIR=$libDir"

      # ── Runtime sidecars (SPEC §14) ─────────────────────────────
      # The app shells out to whisper-cli + ffmpeg + ffprobe, and all
      # three ship inside the installers as Tauri externalBin
      # sidecars. tauri-build validates externalBin existence at
      # compile time, so the files must be in src-tauri\binaries
      # BEFORE cargo test / tauri build run.

      # ffmpeg/ffprobe: pinned BtbN autobuild (tag
      # autobuild-2026-10-27-18-38), LGPL *static* build of the
      # FFmpeg 8.1 branch. We only decode common formats and encode
      # 16 kHz mono WAV — all LGPL-covered functionality — so the
      # LGPL (not GPL) variant keeps redistribution clean; static
      # means each exe is self-contained, no DLLs to ship alongside.
      - name: Fetch ffmpeg/ffprobe sidecars (BtbN, LGPL, pinned)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stem = 'ffmpeg-n8.1.3-24-g92611900bb-win64-lgpl-8.1'
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-27-18-38/$stem.zip"
          $dest = Join-Path $env:RUNNER_TEMP 'ffmpeg-sidecar'
          New-Item -ItemType Directory -Force $dest | Out-Null
          $zip = Join-Path $dest "$stem.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          tar -xf $zip -C $dest
          $binDir = Join-Path $dest "$stem\bin"
          $sidecarDir = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\binaries'
          New-Item -ItemType Directory -Force $sidecarDir | Out-Null
          Copy-Item (Join-Path $binDir 'ffmpeg.exe') (Join-Path $sidecarDir 'ffmpeg-x86_64-pc-windows-msvc.exe')
          Copy-Item (Join-Path $binDir 'ffprobe.exe') (Join-Path $sidecarDir 'ffprobe-x86_64-pc-windows-msvc.exe')
          foreach ($name in 'ffmpeg-x86_64-pc-windows-msvc.exe', 'ffprobe-x86_64-pc-windows-msvc.exe') {
            if (-not (Test-Path (Join-Path $sidecarDir $name))) {
              throw "ffmpeg sidecar missing after copy: $name"
            }
          }
          Write-Host 'ffmpeg/ffprobe sidecars in place.'

      # whisper-cli: built from source — ggml-org/whisper.cpp
      # v1.9.5, the nearest release tag to the dev snapshot the
      # Phase 2 spikes validated (1.9.5-dev @ 21ba6d26, 135 commits
      # past the v1.9.5 tag). BUILD_SHARED_LIBS=OFF + static CRT →
      # one self-contained whisper-cli.exe (ggml linked in, no DLL
      # dependencies beyond Windows itself).
      #
      # TWO builds ship (v1.1.1, SPEC §19): fast, and a compat build
      # with every post-baseline CPU feature off, for processors
      # without AVX2 (the 1.1.0 Acer field failure: whisper died
      # with 0xC000001D STATUS_ILLEGAL_INSTRUCTION). The recipes live
      # in the source repo (packaging/build-whisper.ps1) so they can
      # be fixed through the normal sync path instead of by editing
      # this workflow; SPEC §19.8 explains why the compat recipe also
      # links baseline CRT memory routines. The proof steps below
      # gate the result.
      - name: Build whisper-cli sidecars (whisper.cpp v1.9.5, fast + compat)
        shell: pwsh
        run: ./packaging/build-whisper.ps1 -Variant all

      # ── Engine proof (v1.1.1, RELEASE_QA.md gate) ─────────────
      # The compat engine is PROVEN, not just built — two checks on
      # the actual Windows binaries, failing the build loudly:
      # 1. static audit: zero VEX/EVEX-prefixed instructions in the
      #    compat binary (first encoding byte c4/c5/62 — in 64-bit
      #    mode those are VEX/EVEX-only), and a non-zero count in
      #    the fast binary (a zero there would mean the scan is
      #    blind and the proof is void);
      # 2. emulated run: the compat binary transcribes the bundled
      #    benchmark clip under Intel SDE pinned to a Pentium 4
      #    Prescott profile (pre-AVX, pre-BMI2, pre-SSE4.2), while
      #    the fast binary MUST fail the same run — if it passes,
      #    the harness cannot distinguish the builds and the proof
      #    is void.
      - name: Audit whisper engines (compat must contain no VEX/EVEX instructions)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The report directory is created FIRST, so the upload step
          # below (if: always()) has evidence to publish even when a
          # check in this step throws.
          $reportDir = Join-Path $env:RUNNER_TEMP 'engine-audit'
          New-Item -ItemType Directory -Force $reportDir | Out-Null
          $report = Join-Path $reportDir 'engine-audit-report.txt'
          function Log([string]$Line) {
            Write-Host $Line
            $Line | Out-File -FilePath $report -Append -Encoding utf8
          }
          Log "Aurivox engine audit - run ${{ github.run_id }}, sha ${{ github.sha }}, $(Get-Date -Format o)"
          $sidecarDir = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\binaries'
          $fastExe = Join-Path $sidecarDir 'whisper-cli-x86_64-pc-windows-msvc.exe'
          $compatExe = Join-Path $sidecarDir 'whisper-cli-compat-x86_64-pc-windows-msvc.exe'
          Log "fast:   $fastExe"
          Log "compat: $compatExe"
          # Function-range audit (SPEC §19.10): the old gate counted
          # VEX/EVEX first bytes over a linear disassembly sweep,
          # which decodes MSVC switch jump-table DATA as phantom
          # instructions (11 of run #7's 237) and can therefore never
          # read zero on a correct MSVC binary. The count now comes
          # from packaging/audit_engines.py: it decodes only at true
          # function boundaries (.pdata RUNTIME_FUNCTION ranges),
          # excludes jump tables as data, and reports REAL VEX/EVEX
          # instructions with their owning-function clusters (the
          # full output lands in the report artifact below).
          # Gate: compat REAL == 0 AND fast REAL > 0 -- the fast
          # control must be non-zero, because a counter that reads
          # zero on the AVX2 build is broken, not passing.
          python -m pip install --quiet capstone==5.0.7
          if ($LASTEXITCODE -ne 0) {
            throw 'pip install capstone failed — the instruction audit is a release gate (RELEASE_QA.md) and must not be skipped'
          }
          $auditor = Join-Path $env:GITHUB_WORKSPACE 'packaging\audit_engines.py'
          function Count-RealVex([string]$Exe, [string]$Label) {
            $out = & python $auditor $Exe
            $code = $LASTEXITCODE
            $out | ForEach-Object { Log $_ }
            if ($code -ne 0) {
              throw "function-range audit failed to run on the $Label engine (exit $code)"
            }
            foreach ($line in $out) {
              if ($line -match '^REAL_VEX_COUNT=(\d+)$') { return [int]$Matches[1] }
            }
            throw "function-range audit produced no REAL_VEX_COUNT for the $Label engine"
          }
          $fastCount = Count-RealVex $fastExe 'fast'
          $compatCount = Count-RealVex $compatExe 'compat'
          Log "VEX/EVEX instructions at true function boundaries: fast=$fastCount compat=$compatCount"
          $auditProblems = @()
          if ($fastCount -eq 0) {
            $auditProblems += 'audit invalid: the fast engine shows no real VEX instructions — the counter is not seeing the code'
          }
          if ($compatCount -ne 0) {
            $auditProblems += "compat engine contains $compatCount real VEX/EVEX instructions — NOT safe for pre-AVX CPUs"
          }
          if ($auditProblems.Count -gt 0) {
            foreach ($problem in $auditProblems) {
              Log "FAIL: $problem"
            }
            throw ($auditProblems -join '; ')
          }
          Log 'audit passed: compat contains no real VEX/EVEX instructions; fast control is non-zero.'

      # The audit report is evidence, not just a gate: publish it on
      # every run (pass or fail) so a regression can be diagnosed
      # from artifacts alone. On any failure, also publish the compat
      # binary itself for offline analysis (SPEC §19.8).
      - name: Upload engine audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-audit-report-${{ github.sha }}
          path: ${{ runner.temp }}/engine-audit
          if-no-files-found: warn
          retention-days: 14

      - name: Upload compat engine binary (on failure, for offline analysis)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: whisper-cli-compat-failed-${{ github.sha }}
          path: src-tauri/binaries/whisper-cli-compat-x86_64-pc-windows-msvc.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Prove compat engine under a pre-AVX CPU (Intel SDE, Pentium 4 profile)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdeDir = Join-Path $env:RUNNER_TEMP 'sde'
          New-Item -ItemType Directory -Force $sdeDir | Out-Null
          $sdeTar = Join-Path $sdeDir 'sde.tar.xz'
          Invoke-WebRequest -Uri 'https://downloadmirror.intel.com/859732/sde-external-9.58.0-2025-06-16-win.tar.xz' -OutFile $sdeTar
          tar -xf $sdeTar -C $sdeDir
          $sde = Get-ChildItem -Path $sdeDir -Recurse -Filter 'sde64.exe' | Select-Object -First 1
          if (-not $sde) {
            $sde = Get-ChildItem -Path $sdeDir -Recurse -Filter 'sde.exe' | Select-Object -First 1
          }
          if (-not $sde) {
            throw 'sde executable missing after extract'
          }
          $sidecarDir = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\binaries'
          $fastExe = Join-Path $sidecarDir 'whisper-cli-x86_64-pc-windows-msvc.exe'
          $compatExe = Join-Path $sidecarDir 'whisper-cli-compat-x86_64-pc-windows-msvc.exe'
          $srcRoot = $env:AURIVOX_WHISPER_SRC
          if (-not $srcRoot) {
            $srcRoot = Join-Path $env:RUNNER_TEMP 'aurivox-whisper-build\src'
          }
          $model = Join-Path $srcRoot 'models\for-tests-ggml-tiny.bin'
          $clip = Join-Path $env:GITHUB_WORKSPACE 'src-tauri\resources\benchmark\clip.wav'
          Write-Host 'compat engine under SDE -p4p (Pentium 4 Prescott: no AVX/BMI2/SSE4.2)...'
          & $sde.FullName -p4p -- $compatExe -m $model -f $clip -t 2
          if ($LASTEXITCODE -ne 0) {
            throw "compat engine FAILED under the pre-AVX SDE profile (exit $LASTEXITCODE) — it still touches a post-baseline instruction"
          }
          Write-Host 'fast engine under the same profile (control — must fail)...'
          & $sde.FullName -p4p -- $fastExe -m $model -f $clip -t 2
          if ($LASTEXITCODE -eq 0) {
            throw 'control failed: the FAST engine ran clean under the pre-AVX profile — this proof cannot distinguish the builds; investigate before shipping'
          }
          Write-Host 'compat proof passed: compat transcribes on a Pentium-4-class CPU; the fast build provably cannot.'
          # Both checks passed. The fast control run above exits
          # non-zero BY DESIGN, so $LASTEXITCODE is still non-zero
          # here — and the GitHub Actions pwsh wrapper propagates
          # the script's final $LASTEXITCODE as the step's exit
          # code (run #11, SPEC §19.13: this step printed the pass
          # line above, then failed with exit code 1). End the
          # step explicitly green; every genuine failure throws
          # before this line.
          exit 0

      - name: Rust unit tests (credits, recommendation rules, manifest)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri app (MSI + NSIS)
        run: npx tauri build

      # ── MSIX packaging (Phase 8 machinery, Phase 9 identity) ────
      # Pack the release output with makeappx using the REAL Partner
      # Center identity (defaults in packaging/make-msix.ps1; Aurivox
      # reserved 2026-10-28, SPEC §14/§15). Strict on purpose: if
      # this step breaks, the job fails, so a green run proves the
      # whole packaging path (layout staging, manifest substitution,
      # makeappx) end to end. The package is unsigned; the Store
      # signs at certification.
      - name: Pack MSIX (real Partner Center identity)
        shell: pwsh
        run: ./packaging/make-msix.ps1 -OutFile (Join-Path $env:GITHUB_WORKSPACE 'aurivox.msix')

      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: aurivox-msix-${{ github.sha }}
          path: aurivox.msix
          if-no-files-found: error
          retention-days: 14

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: aurivox-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
